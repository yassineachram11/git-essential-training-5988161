<script>
// Seeded particles and mist along a curved band. cfg: from/ctrl/to points (0..1),
// spread, count, seed, mist (bool), size scale, alpha.
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ var u = 1 - r(), v = r(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function bez(a,b,c,t){ return (1-t)*(1-t)*a + 2*(1-t)*t*b + t*t*c; }
function fx(id, cfg){
  var cv = document.getElementById(id), ctx = cv.getContext('2d'), W = cv.width, H = cv.height, r = rng(cfg.seed||1);
  var P = function(k,t){ return [bez(cfg.from[0],cfg.ctrl[0],cfg.to[0],t)*W, bez(cfg.from[1],cfg.ctrl[1],cfg.to[1],t)*H]; };
  if (cfg.mist) {
    ctx.filter = 'blur(' + (cfg.mistBlur||28) + 'px)';
    for (var w = 0; w < (cfg.wisps||7); w++) {
      ctx.beginPath();
      var off = gauss(r) * cfg.spread * W * 0.6, ph = r() * 6.28;
      for (var t = 0; t <= 1.0001; t += 0.02) {
        var p = P(0,t), wob = Math.sin(t * 9 + ph) * 26 + off * t;
        var x = p[0] + wob * 0.6, y = p[1] + wob;
        t === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle = 'rgba(120,185,255,' + (0.05 + r()*0.07) + ')';
      ctx.lineWidth = 30 + r() * 70;
      ctx.stroke();
    }
    ctx.filter = 'none';
  }
  for (var i = 0; i < cfg.count; i++) {
    var t = Math.pow(r(), cfg.bias || 1), p = P(0,t);
    var sp = cfg.spread * W * (0.25 + t * 0.9);
    var x = p[0] + gauss(r) * sp * 0.7, y = p[1] + gauss(r) * sp;
    var s = (0.6 + Math.pow(r(), 3) * 3.2) * (cfg.size || 1);
    var a = (0.25 + r() * 0.75) * (cfg.alpha || 1) * (1 - t * 0.55);
    ctx.shadowColor = 'rgba(140,200,255,' + a + ')';
    ctx.shadowBlur = s * 5;
    ctx.fillStyle = 'rgba(' + (190 + r()*60|0) + ',' + (225 + r()*30|0) + ',255,' + a + ')';
    ctx.beginPath(); ctx.arc(x, y, s, 0, 6.283); ctx.fill();
  }
}

window.renderAt=function(t){
 var q=function(s){return document.querySelector(s)};
